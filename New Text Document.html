<h1>My Personal Information</h1>

<script>

    // 1. Declare variables
    let name;
    let gpa;
    let major;
    let favoriteHobby;

    // 2. Assign personal information
    name = "Yazeed Abualrub";
    gpa = 3.5;
    major = "Telecommunication Engineering";
    favoriteHobby = "Programming";

    // 3. Display using alert()
    alert("Name: " + name +
          "\nGPA: " + gpa +
          "\nMajor: " + major +
          "\nFavorite Hobby: " + favoriteHobby);

    // 4. Display using console.log()
    console.log("Name: " + name);
    console.log("GPA: " + gpa);
    console.log("Major: " + major);
    console.log("Favorite Hobby: " + favoriteHobby);

    // 5. Display using document.write()
    document.write("<p>Name: " + name + "</p>");
    document.write("<p>GPA: " + gpa + "</p>");
    document.write("<p>Major: " + major + "</p>");
    document.write("<p>Favorite Hobby: " + favoriteHobby + "</p>");

</script>
